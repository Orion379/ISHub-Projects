<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <style>
      :root {
        --ink: #0f79c0;
        --ink-soft: #565d66;
        --paper: #f6f5f2;
        --card: #ffffff;
        --line: #e2e0da;
        --accent: #2f6f4f;
        --accent-soft: #e6efe9;
        --danger: #f80b0b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        display: flex;
        justify-content: center;
        padding: 48px 20px;
      }

      #app {
        width: 100%;
        max-width: 480px;
      }

      h2 {
        font-size: 2.8rem;
        font-weight: 600;
        margin: 0 0 4px;
        letter-spacing: -0.01em;
      }

      .subhead {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.85rem;
        color: var(--ink-soft);
        margin: 0 0 24px;
      }

      .add-row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }

      #taskInput {
        flex: 1;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        font-family: inherit;
        font-size: 1rem;
        color: var(--ink);
        min-width: 0;
      }

      #taskInput:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      #dueDateInput {
        padding: 12px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.85rem;
        color: var(--ink-soft);
        width: 132px;
        flex-shrink: 0;
      }

      #dueDateInput:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      button {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer;
        border: none;
      }

      #addBtn {
        padding: 12px 18px;
        background: var(--ink);
        color: #fff;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        flex-shrink: 0;
      }

      #addBtn:hover {
        background: #25b1b6;
      }

      .hint {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.75rem;
        color: var(--ink-soft);
        margin: 0 0 18px;
      }

      .filters {
        display: flex;
        gap: 6px;
        margin-bottom: 16px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 16px;
      }

      .filters button {
        background: transparent;
        color: var(--ink-soft);
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 0.85rem;
      }

      .filters button:hover {
        background: var(--accent-soft);
        color: var(--ink);
      }

      .filters button.active {
        background: var(--ink);
        color: #fff;
      }

      #taskList {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      #taskList li {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 4px;
        border-bottom: 1px solid var(--line);
      }

      #taskList li:last-child {
        border-bottom: none;
      }

      .task-check {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        border: 1.5px solid var(--ink-soft);
        background: var(--card);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        color: transparent;
        padding: 0;
        margin-top: 1px;
      }

      .task-check.done {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .task-body {
        flex: 1;
        min-width: 0;
      }

      .task-text {
        display: block;
        font-size: 1rem;
        line-height: 1.4;
        word-break: break-word;
        cursor: text;
      }

      .task-text.done {
        text-decoration: line-through;
        color: var(--ink-soft);
      }

      .task-due {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.75rem;
        color: var(--ink-soft);
        margin-top: 2px;
      }

      .task-due.overdue {
        color: var(--danger);
      }

      .task-edit-input {
        width: 100%;
        font-family: inherit;
        font-size: 1rem;
        padding: 4px 6px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--accent-soft);
        color: var(--ink);
      }

      .task-edit-input:focus {
        outline: none;
      }

      .delete-btn {
        background: transparent;
        color: var(--ink-soft);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 1.1rem;
        line-height: 1;
        padding: 4px 6px;
        border-radius: 6px;
        flex-shrink: 0;
      }

      .delete-btn:hover {
        background: #f3e4de;
        color: var(--danger);
      }

      .empty-state {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink-soft);
        font-size: 0.9rem;
        padding: 24px 4px;
        text-align: center;
      }

      .footer-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #counter {
        font-size: 0.85rem;
        color: var(--ink-soft);
      }

      #clearDoneBtn {
        background: transparent;
        color: var(--danger);
        font-size: 0.85rem;
        padding: 6px 10px;
        border-radius: 6px;
      }

      #clearDoneBtn:hover {
        background: #f3e4de;
      }

      #clearDoneBtn:disabled {
        color: var(--line);
        cursor: default;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h2>Task Manager</h2>
      <p class="subhead">Keeps your list, even after you refresh!</p>

      <div class="add-row">
        <input type="text" id="taskInput" placeholder="New task..." />
        <input type="date" id="dueDateInput" aria-label="Due date (optional)" />
        <button id="addBtn">Add</button>
      </div>
      <p class="hint">Tip: double-click a task's text to edit it.</p>

      <div class="filters">
        <button id="showAllBtn" class="active">All</button>
        <button id="showActiveBtn">Active</button>
        <button id="showDoneBtn">Done</button>
      </div>

      <ul id="taskList"></ul>

      <div class="footer-row">
        <span id="counter"></span>
        <button id="clearDoneBtn">Clear Done</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
